<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>House tasks</title>
<style>
  :root {
    --bg: #f5f3ef; --card: #ffffff; --ink: #1f2421; --muted: #6b716d; --line: #e4e0d8;
    --accent: #2f6f5e; --accent-ink: #ffffff; --chip: #ece8e0;
    --urgent: #d2412f; --high: #d98a1c; --low: #8a8f8b; --done: #3c8c5a; --waiting: #7a6ad1;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --ink: #eceeea; --muted: #9aa19c; --line: #2f3431;
      --accent: #5fb49a; --accent-ink: #0f1311; --chip: #2a2f2c;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { font-size: 1.35rem; margin: 0; flex: 1; letter-spacing: -.01em; }
  .icon-btn { border: 0; background: var(--chip); width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font-size: 1.05rem; }
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid transparent; background: var(--chip); border-radius: 999px;
    padding: 6px 13px; white-space: nowrap; font-size: .92rem; }
  .chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--accent-ink); }
  .chip .n { opacity: .7; margin-left: 4px; font-size: .85em; }
  .search { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--card);
    border-radius: 12px; padding: 9px 12px; }

  main { padding: 4px 12px calc(env(safe-area-inset-bottom) + 96px); max-width: 720px; margin: 0 auto; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .task { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: var(--radius);
    padding: 10px 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; }
  .task.p-urgent { border-left-color: var(--urgent); }
  .task.p-high { border-left-color: var(--high); }
  .task.s-waiting { border-left-color: var(--waiting); }
  .task.closed { opacity: .65; }
  .task.closed .title { text-decoration: line-through; text-decoration-thickness: 1px; }
  .check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; display: grid; place-items: center; font-size: .9rem; color: var(--done); }
  .check:hover { border-color: var(--done); }
  .task.closed .check { background: var(--done); border-color: var(--done); color: #fff; }
  .body { flex: 1; min-width: 0; cursor: pointer; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .title .id { color: var(--muted); font-weight: 500; margin-right: 4px; font-size: .9em; }
  .meta { color: var(--muted); font-size: .86rem; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meta .overdue { color: var(--urgent); font-weight: 600; }
  .who { flex: none; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: .78rem; font-weight: 700; color: #fff; }
  .take { border: 1px solid var(--accent); color: var(--accent); background: transparent;
    border-radius: 999px; padding: 4px 11px; font-size: .85rem; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .big { font-size: 2.4rem; }
  .section-label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    margin: 16px 4px 6px; }

  .add { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); border-top: 1px solid var(--line); }
  .add form { display: flex; gap: 8px; max-width: 720px; margin: 0 auto; }
  .add input { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 12px 16px; font-size: 1rem; }
  .add input:focus, .search:focus, textarea:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .add button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 50%;
    width: 48px; height: 48px; font-size: 1.6rem; line-height: 1; flex: none; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(env(safe-area-inset-bottom) + 84px); background: var(--ink); color: var(--bg);
    border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center;
    box-shadow: var(--shadow); max-width: calc(100% - 24px); }
  .toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .toast button { color: #0f5d49; } }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto;
    background: var(--card); border-radius: 18px 18px 0 0; padding: 0 16px calc(env(safe-area-inset-bottom) + 24px);
    box-shadow: 0 -8px 30px rgba(0,0,0,.15); overscroll-behavior: contain; }
  @media (min-width: 760px) {
    .sheet { left: 50%; right: auto; bottom: auto; top: 6vh; transform: translateX(-50%);
      width: 620px; border-radius: 18px; max-height: 88vh; }
    .grab { display: none; }
  }
  .sheet-head { position: sticky; top: 0; background: var(--card); display: flex; align-items: center;
    gap: 8px; padding: 12px 0 8px; z-index: 1; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
  .sheet-head .id { color: var(--muted); font-weight: 600; flex: 1; }
  .sheet-head a { color: var(--accent); text-decoration: none; font-size: .9rem; }
  .title-edit { width: 100%; border: 0; background: transparent; font-size: 1.3rem; font-weight: 700;
    resize: none; padding: 4px 0; line-height: 1.3; }
  .field { margin-top: 16px; }
  .field > label, .field > .label { display: block; font-size: .78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--chip); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-size: .88rem; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 700; }
  .field input[type=text], .field input[type=date], .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; }
  .field textarea { min-height: 80px; resize: vertical; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .link-btn { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 4px; font-size: .85rem; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--chip); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .rm { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: .8rem; }
  .photo.addp { display: grid; place-items: center; border: 2px dashed var(--line); background: transparent;
    font-size: 1.6rem; color: var(--muted); }
  .timeline { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
  .timeline .ev { font-size: .85rem; color: var(--muted); }
  .timeline .comment { background: var(--bg); border-radius: 12px; padding: 8px 11px; }
  .timeline .comment .who { font-weight: 700; font-size: .85rem; }
  .timeline time { color: var(--muted); font-size: .78rem; margin-left: 6px; }
  .signed-out { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 24px; }
  .signed-out code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  .danger { color: var(--urgent); }
</style>
</head>
<body>
<div id="app" hidden>
  <header>
    <div class="top">
      <h1 id="house-name">House</h1>
      <button class="icon-btn" id="search-toggle" aria-label="Search">🔎</button>
      <button class="icon-btn" id="me-btn" aria-label="Account"></button>
    </div>
    <nav class="filters" id="filters" aria-label="Filter tasks"></nav>
    <input class="search" id="search" type="search" placeholder="Search tasks, places…" hidden>
  </header>
  <main>
    <ul class="list" id="list" aria-live="polite"></ul>
  </main>
  <div class="add">
    <form id="add-form" autocomplete="off">
      <input id="add-input" enterkeyhint="send" placeholder="Add a task…  #kitchen !urgent" aria-label="New task">
      <button aria-label="Add task">+</button>
    </form>
  </div>
</div>

<div class="signed-out" id="signed-out" hidden>
  <div style="font-size:3rem">🏠</div>
  <h2>House tasks</h2>
  <p id="signed-out-msg">To open this on your phone, send <code>!web</code> to the house bot in Matrix.
     It will message you a personal link.</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="f-title"></section>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="file" accept="image/*,application/pdf" hidden>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const S = { me: null, house: null, people: new Map(), tasks: new Map(), version: -1,
            filter: "open", query: "", openId: null };

// ── API ─────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { "X-HouseOps": "1", ...(opts.json ? { "Content-Type": "application/json" } : {}) };
  const res = await fetch(path, { method: opts.method || "GET", headers, credentials: "same-origin",
    body: opts.json ? JSON.stringify(opts.json) : opts.body });
  if (res.status === 401) { signedOut(); throw new Error("signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || "Something went wrong"); throw new Error(data.error); }
  return data;
}

function applyTask(t) {
  S.tasks.set(t.id, t);
  render();
  if (S.openId === t.id) renderSheet();
}

// ── Boot, sign-in, sync ─────────────────────────────────────────────────────
async function boot() {
  if (location.pathname === "/login" && location.hash.length > 1) {
    const token = location.hash.slice(1);
    history.replaceState(null, "", "/");
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }) });
      if (!res.ok) { const d = await res.json().catch(() => ({})); signedOut(d.error); return; }
    } catch { signedOut("Could not reach the house server."); return; }
  }
  await load();
  setInterval(poll, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  window.addEventListener("hashchange", route);
}

async function load() {
  let data;
  try { data = await api("/api/bootstrap"); } catch { return; }
  S.me = data.me; S.house = data.house; S.version = data.version;
  S.people = new Map(data.people.map((p) => [p.id, p]));
  S.tasks = new Map(data.tasks.map((t) => [t.id, t]));
  $("app").hidden = false; $("signed-out").hidden = true;
  $("house-name").textContent = data.house.name;
  document.title = data.house.name + " tasks";
  const meBtn = $("me-btn");
  meBtn.textContent = initials(data.me.name); meBtn.style.background = color(data.me.id); meBtn.style.color = "#fff";
  render();
  route();
}

async function poll() {
  if (document.hidden || !S.me) return;
  try {
    const { version } = await api("/api/version");
    if (version !== S.version) await load();
  } catch {}
}

function signedOut(msg) {
  $("app").hidden = true; $("signed-out").hidden = false;
  if (msg) $("signed-out-msg").textContent = msg;
}

function route() {
  const m = location.hash.match(/^#\/task\/(\d+)/);
  if (m && S.tasks.has(+m[1])) openSheet(+m[1], false);
  else if (!m && S.openId) closeSheet(false);
}

// ── Helpers ─────────────────────────────────────────────────────────────────
const nameOf = (id) => (S.people.get(id)?.name) || (id || "").replace(/^@/, "").split(":")[0];
const initials = (name) => (name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
function color(id) {
  let h = 0; for (const c of id || "") h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 45% 45%)`;
}
const cat = (key) => S.house?.categories.find((c) => c.key === key);
const isClosed = (t) => t.status === "done" || t.status === "dropped";
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(iso) { return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  if (s < 7 * 86400) return Math.floor(s / 86400) + " d ago";
  return new Date(ts).toLocaleDateString();
}
const PRIO = { urgent: 3, high: 2, normal: 1, low: 0 };
const PRIO_EMOJI = { urgent: "🔥", high: "❗", normal: "", low: "💤" };
const namesInText = (s) => String(s).replace(/@[^\s:]+:[^\s,]+/g, (m) => nameOf(m));

let toastTimer;
function toast(text, action, onAction) {
  const el = $("toast");
  el.innerHTML = `<span>${esc(text)}</span>` + (action ? `<button>${esc(action)}</button>` : "");
  el.hidden = false;
  if (action) el.querySelector("button").onclick = () => { el.hidden = true; onAction(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), action ? 6000 : 3500);
}

// ── List ────────────────────────────────────────────────────────────────────
const FILTERS = [
  ["open", "Open", (t) => !isClosed(t)],
  ["mine", "Mine", (t) => !isClosed(t) && t.assignee === S.me?.id],
  ["free", "Up for grabs", (t) => t.status === "open" && !t.assignee],
  ["waiting", "Waiting", (t) => t.status === "waiting"],
  ["done", "Done", (t) => isClosed(t)],
];

function renderFilters() {
  const all = [...S.tasks.values()];
  $("filters").innerHTML = FILTERS.map(([key, label, fn]) => {
    const n = key === "done" ? "" : `<span class="n">${all.filter(fn).length}</span>`;
    return `<button class="chip" data-filter="${key}" aria-pressed="${S.filter === key}">${label}${n}</button>`;
  }).join("");
}

function sortTasks(list) {
  if (S.filter === "done") return list.sort((a, b) => (b.closed_at || "").localeCompare(a.closed_at || ""));
  return list.sort((a, b) =>
    (a.status === "waiting") - (b.status === "waiting") ||
    PRIO[b.priority] - PRIO[a.priority] ||
    (a.due || "9999").localeCompare(b.due || "9999") ||
    b.id - a.id);
}

function row(t) {
  const c = cat(t.category);
  const meta = [];
  if (t.status === "waiting") meta.push(`⏸️ ${esc(t.waiting_on || "waiting")}`);
  if (c) meta.push(`${c.emoji} ${esc(c.label)}`);
  if (t.location) meta.push(`📍 ${esc(t.location)}`);
  if (t.due && !isClosed(t)) {
    const late = t.due < todayISO();
    meta.push(`<span class="${late ? "overdue" : ""}">📅 ${late ? "overdue · " : ""}${esc(fmtDate(t.due))}</span>`);
  }
  if (t.attachments.length) meta.push(`📎 ${t.attachments.length}`);
  if (isClosed(t) && t.closed_by) meta.push(`${t.status === "done" ? "done" : "dropped"} by ${esc(nameOf(t.closed_by))} · ${ago(t.closed_at)}`);
  const who = t.assignee
    ? `<div class="avatar" style="background:${color(t.assignee)}" title="${esc(nameOf(t.assignee))}">${esc(initials(nameOf(t.assignee)))}</div>`
    : isClosed(t) ? "" : `<button class="take" data-take="${t.id}">Take</button>`;
  const prio = PRIO_EMOJI[t.priority] ? PRIO_EMOJI[t.priority] + " " : "";
  return `<li class="task p-${t.priority} s-${t.status} ${isClosed(t) ? "closed" : ""}">
    <button class="check" data-done="${t.id}" aria-label="${isClosed(t) ? "Reopen" : "Mark done"}">${isClosed(t) ? "✓" : ""}</button>
    <div class="body" data-open="${t.id}">
      <div class="title"><span class="id">#${t.id}</span>${prio}${esc(t.title)}</div>
      ${meta.length ? `<div class="meta">${meta.map((m) => `<span>${m}</span>`).join("")}</div>` : ""}
    </div>
    <div class="who">${who}</div>
  </li>`;
}

function render() {
  if (!S.me) return;
  renderFilters();
  const fn = FILTERS.find(([k]) => k === S.filter)[2];
  const q = S.query.trim().toLowerCase();
  let list = [...S.tasks.values()].filter(fn);
  if (q) list = [...S.tasks.values()].filter((t) =>
    [t.title, t.description, t.location, cat(t.category)?.label, nameOf(t.assignee), "#" + t.id]
      .some((v) => (v || "").toLowerCase().includes(q)));
  list = sortTasks(list);
  if (S.filter === "done" && !q) list = list.slice(0, 60);
  const el = $("list");
  if (!list.length) {
    const msg = q ? "Nothing matches." : {
      open: ["🎉", "Nothing open. The house is in order."], mine: ["☕", "Nothing on your plate."],
      free: ["🙌", "Everything has someone on it."], waiting: ["⏳", "Nothing is waiting."], done: ["📭", "Nothing done yet."],
    }[S.filter];
    el.innerHTML = Array.isArray(msg) ? `<li class="empty"><div class="big">${msg[0]}</div>${msg[1]}</li>` : `<li class="empty">${msg}</li>`;
    return;
  }
  el.innerHTML = list.map(row).join("");
}

// ── Actions ─────────────────────────────────────────────────────────────────
const patch = (id, body) => api(`/api/tasks/${id}`, { method: "PATCH", json: body }).then(applyTask);

async function toggleDone(id) {
  const t = S.tasks.get(id);
  if (isClosed(t)) { await patch(id, { status: t.assignee ? "doing" : "open" }); return; }
  const before = t.status;
  await patch(id, { status: "done" });
  toast(`#${id} done ✅`, "Undo", () => patch(id, { status: before }));
}

$("list").addEventListener("click", (e) => {
  const done = e.target.closest("[data-done]");
  const take = e.target.closest("[data-take]");
  const open = e.target.closest("[data-open]");
  if (done) toggleDone(+done.dataset.done);
  else if (take) patch(+take.dataset.take, { assignee: S.me.id }).then(() => toast("It's yours 👍"));
  else if (open) openSheet(+open.dataset.open);
});
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (b) { S.filter = b.dataset.filter; render(); }
});
$("search-toggle").onclick = () => {
  const s = $("search"); s.hidden = !s.hidden;
  if (!s.hidden) s.focus(); else { s.value = ""; S.query = ""; render(); }
};
$("search").addEventListener("input", (e) => { S.query = e.target.value; render(); });
$("me-btn").onclick = () => toast(`Signed in as ${S.me.name}`, "Sign out", async () => {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  signedOut("Signed out. Send !web to the house bot for a new link.");
});

$("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("add-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    const t = await api("/api/tasks", { method: "POST", json: { text } });
    applyTask(t);
    if (S.filter !== "open" && S.filter !== "free") { S.filter = "open"; render(); }
    toast(`#${t.id} added`, "Add details", () => openSheet(t.id));
  } catch { input.value = text; }
  input.focus();
});

// ── Detail sheet ────────────────────────────────────────────────────────────
function openSheet(id, push = true) {
  S.openId = id;
  if (push && location.hash !== `#/task/${id}`) history.pushState(null, "", `#/task/${id}`);
  $("scrim").hidden = false; $("sheet").hidden = false;
  document.body.style.overflow = "hidden";
  renderSheet(true);
}
function closeSheet(push = true) {
  S.openId = null;
  $("scrim").hidden = true; $("sheet").hidden = true;
  document.body.style.overflow = "";
  if (push && location.hash) history.pushState(null, "", location.pathname);
}
$("scrim").onclick = () => closeSheet();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.openId) closeSheet(); });

function chip(label, on, attrs) { return `<button class="chip ${on ? "on" : ""}" ${attrs}>${label}</button>`; }

function renderSheet(fresh = false) {
  const t = S.tasks.get(S.openId);
  const el = $("sheet");
  if (!t) { closeSheet(); return; }
  // Don't clobber what someone is typing when a sync arrives.
  const focused = document.activeElement;
  if (!fresh && el.contains(focused) && focused.matches("textarea, input")) return;

  const matrixLink = t.card ? `https://matrix.to/#/${encodeURIComponent(t.card.room_id)}/${encodeURIComponent(t.card.event_id)}` : null;
  const statuses = [["open", "Open"], ["doing", "Doing"], ["waiting", "Waiting"], ["done", "Done"]];
  const people = [...S.people.values()].filter((p) => p.member || p.id === t.assignee || p.id === S.me.id);
  const locs = [...new Set([...(S.house.locations || []), ...[...S.tasks.values()].map((x) => x.location).filter(Boolean)])];
  const due = t.due || "";

  const history = [...t.history].reverse().map((h) => {
    const time = `<time>${ago(h.at)}</time>`;
    if (h.kind === "comment") return `<li class="comment"><span class="who">${esc(nameOf(h.actor))}</span>${time}<div>${esc(h.text)}</div></li>`;
    const what = h.kind === "created" ? "created this" : h.kind === "attachment" ? `added ${esc(h.file_name)}` : esc(namesInText(h.what));
    return `<li class="ev">${esc(nameOf(h.actor))} ${what}${time}</li>`;
  }).join("");

  el.innerHTML = `
    <div class="grab"></div>
    <div class="sheet-head">
      <span class="id">#${t.id}${t.status === "dropped" ? " · dropped" : ""}</span>
      ${matrixLink ? `<a href="${esc(matrixLink)}" target="_blank" rel="noopener">Open in Matrix ↗</a>` : ""}
      <button class="icon-btn" id="close" aria-label="Close">✕</button>
    </div>
    <textarea class="title-edit" id="f-title" rows="1" aria-label="Title">${esc(t.title)}</textarea>

    <div class="field"><div class="seg" role="group" aria-label="Status">
      ${statuses.map(([k, l]) => `<button data-status="${k}" aria-pressed="${t.status === k}">${l}</button>`).join("")}
    </div></div>
    ${t.status === "waiting" ? `<div class="field"><label for="f-wait">Waiting on</label>
      <input type="text" id="f-wait" value="${esc(t.waiting_on || "")}" placeholder="e.g. landlord, spare part"></div>` : ""}

    <div class="field"><span class="label">Who</span><div class="chips">
      ${chip("🙋 Me", t.assignee === S.me.id, `data-assign="${esc(S.me.id)}"`)}
      ${people.filter((p) => p.id !== S.me.id).map((p) => chip(esc(p.name), t.assignee === p.id, `data-assign="${esc(p.id)}"`)).join("")}
      ${chip("Nobody", !t.assignee, `data-assign=""`)}
    </div></div>

    <div class="field"><span class="label">Priority</span><div class="chips">
      ${["low", "normal", "high", "urgent"].map((p) => chip(`${PRIO_EMOJI[p]} ${p[0].toUpperCase() + p.slice(1)}`.trim(), t.priority === p, `data-prio="${p}"`)).join("")}
    </div></div>

    <div class="field"><span class="label">Where</span><div class="chips">
      ${locs.map((l) => chip(esc(l), t.location === l, `data-loc="${esc(l)}"`)).join("")}
      ${chip("＋ Other…", false, `data-loc-other`)}
    </div></div>

    <div class="field"><span class="label">Kind</span><div class="chips">
      ${S.house.categories.map((c) => chip(`${c.emoji} ${esc(c.label)}`, t.category === c.key, `data-cat="${esc(c.key)}"`)).join("")}
    </div></div>

    <div class="field"><label for="f-due">Due</label><div class="inline">
      <input type="date" id="f-due" value="${esc(due)}" style="max-width:190px">
      ${chip("Today", due === todayISO(), `data-due="${todayISO()}"`)}
      ${chip("Tomorrow", due === addDays(1), `data-due="${addDays(1)}"`)}
      ${due ? `<button class="link-btn" data-due="">clear</button>` : ""}
    </div></div>

    <div class="field"><label for="f-desc">Details</label>
      <textarea id="f-desc" placeholder="Anything useful: what exactly, where, what's needed…">${esc(t.description)}</textarea></div>

    <div class="field"><span class="label">Photos</span><div class="photos">
      ${t.attachments.map((a) => `<div class="photo">${a.mime.startsWith("image/")
        ? `<a href="/api/attachments/${esc(a.id)}" target="_blank"><img loading="lazy" src="/api/attachments/${esc(a.id)}" alt="${esc(a.file_name)}"></a>`
        : `<a href="/api/attachments/${esc(a.id)}" target="_blank" style="display:grid;place-items:center;height:100%">📄</a>`}
        <button class="rm" data-rm="${esc(a.id)}" aria-label="Remove ${esc(a.file_name)}">✕</button></div>`).join("")}
      <button class="photo addp" id="add-photo" aria-label="Add photo">📷</button>
    </div></div>

    <div class="field"><label for="f-comment">Activity</label>
      <form id="comment-form" class="inline"><input type="text" id="f-comment" placeholder="Add a comment…" style="flex:1">
        <button class="chip on">Send</button></form>
      <ul class="timeline">${history}</ul>
    </div>
    ${t.status !== "dropped" && !isClosed(t) ? `<div class="field"><button class="link-btn danger" data-status="dropped">Won't do: drop this task</button></div>` : ""}
    ${t.status === "dropped" ? `<div class="field"><button class="link-btn" data-status="open">Reopen</button></div>` : ""}
  `;
  const title = $("f-title");
  const grow = () => { title.style.height = "auto"; title.style.height = title.scrollHeight + "px"; };
  grow(); title.addEventListener("input", grow);
  title.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); title.blur(); } });
  title.addEventListener("blur", () => { const v = title.value.trim(); if (v && v !== t.title) patch(t.id, { title: v }); });
  const desc = $("f-desc");
  desc.addEventListener("blur", () => { if (desc.value.trim() !== t.description) patch(t.id, { description: desc.value }); });
  const wait = $("f-wait");
  if (wait) wait.addEventListener("change", () => patch(t.id, { status: "waiting", waiting_on: wait.value }));
  $("f-due").addEventListener("change", (e) => patch(t.id, { due: e.target.value || null }));
  $("close").onclick = () => closeSheet();
  $("add-photo").onclick = () => $("file").click();
  $("comment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("f-comment"); const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await api(`/api/tasks/${t.id}/comments`, { method: "POST", json: { text } }).then(applyTask).catch(() => (input.value = text));
  });
}

$("sheet").addEventListener("click", async (e) => {
  const t = S.tasks.get(S.openId);
  if (!t) return;
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.status) {
    const s = b.dataset.status;
    if (s === "waiting") { await patch(t.id, { status: "waiting" }); $("f-wait")?.focus(); }
    else await patch(t.id, { status: s });
  } else if ("assign" in b.dataset) patch(t.id, { assignee: b.dataset.assign || null });
  else if (b.dataset.prio) patch(t.id, { priority: b.dataset.prio });
  else if ("locOther" in b.dataset) {
    const l = prompt("Where?", t.location || "");
    if (l !== null) patch(t.id, { location: l.trim() || null });
  } else if (b.dataset.loc) patch(t.id, { location: t.location === b.dataset.loc ? null : b.dataset.loc });
  else if (b.dataset.cat) patch(t.id, { category: t.category === b.dataset.cat ? null : b.dataset.cat });
  else if ("due" in b.dataset) patch(t.id, { due: b.dataset.due || null });
  else if (b.dataset.rm) {
    if (confirm("Remove this photo?")) api(`/api/tasks/${t.id}/attachments/${b.dataset.rm}`, { method: "DELETE" }).then(applyTask);
  }
});

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file || !S.openId) return;
  const form = new FormData();
  form.append("file", file, file.name || "photo.jpg");
  toast("Uploading…");
  try {
    applyTask(await api(`/api/tasks/${S.openId}/attachments`, { method: "POST", body: form }));
    toast("Photo added 📷");
  } catch {}
});

window.addEventListener("popstate", route);
boot();
</script>
</body>
</html>
